apiVersion: v2
name: villas
description: A Helm chart for the VILLASframework

icon: https://packages.fein-aachen.org/helm/icons/villas_framework.png

type: application

version: 0.15.1
appVersion: 1.18.3

maintainers:
  - name: Steffen Vogel
    email: post@steffenvogel.de
    url: https://www.steffenvogel.de

dependencies:
  - name: rabbitmq
    version: 0.3.2
    repository: "oci://registry-1.docker.io/cloudpirates"
    condition: "broker.enabled"
    alias: broker

  - name: postgres
    version: 0.7.3
    repository: "oci://registry-1.docker.io/cloudpirates"
    condition: "database.enabled"
    alias: database

  - name: minio
    version: 11.10.3
    repository: https://charts.bitnami.com/bitnami
    condition: "s3.enabled"
    alias: s3
